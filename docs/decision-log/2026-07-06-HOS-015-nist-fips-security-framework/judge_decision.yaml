  - "D4: add the SP 800-131A approved-algorithm rule to AGENTS.md sec 3."
  - "D2: author the CSF 2.0 index + FIPS 199 categorization artifact WITH the binding complement-not-substitute statement in the template, cross-mapped to ISO 27001 / ICRC (D5)."
  - "D4: enable Supabase coordinator MFA/TOTP (config; the attribution half is sequenced with HOS-001-08)."
  - "D6: write one concrete incident-response runbook (revoke / rotate / notify)."
  - "Re-label and confirm-complete the already-shipped HOS-008 pile (D2 field-classification docs/DATA_MINIMIZATION.md, D3 event-log retention, D4 search-oracle closure) under the Privacy Framework / CSF outcomes they satisfy."

blocked_or_escalated:
  - "Field-level encryption WITH real key custody: algorithm settled (AES-256-GCM) but GATED on the HOS-2026-008-D2 human key-custody/jurisdiction decision (ideally with counsel). Until answered, encryption is a leak/stolen-dump control only and MUST be labeled as such — never a state-adversary control. Escalation, not a build item here."
  - "Org-scoped Postgres RLS + case-table org_id: blocked on Postgres landing (HOS-2026-001-07 / BLK-001) AND the HOS-2026-011-D4 human policy decision (is reunification case/PII data a shared cross-org pool or org-partitioned?). Tagged in the framework only; this proposal does not unblock it."
  - "Per-person coordinator attribution (retire shared token to break-glass): sequenced with HOS-2026-001-08; AAL2 not claimed complete until it lands (D4)."
  - "Detect/monitoring (Sentry): blocked on a Sentry DSN (EXTERNAL_DEPENDENCIES #13) (D6)."
  - "Which outward framework (NIST vs ISO) the concrete near-term funder/partner requires: open input pending the funder/partner pipeline (D5)."

next_gate: >
  Re-review after the ship-now pile lands: confirm (1) the postgres.ts TLS defect is fixed with
  a regression test and no hosted path yields rejectUnauthorized:false; (2) AGENTS.md sec 3
  carries the approved-algorithm rule; (3) the CSF/FIPS-199 artifact exists WITH the binding
  complement-not-substitute statement in-template and an ISO 27001 / ICRC cross-map; (4) the IR
  runbook exists; (5) coordinator MFA is enabled, with the attribution half honestly marked
  sequenced-with-HOS-001-08 and AAL2 NOT reported as achieved; and (6) Phase 0 did not regress
  (clean build:web + tests green). Field encryption, org-scoped RLS, and Detect/monitoring remain
  gated on their respective human decisions and external dependencies and are re-decided as their
  own gates when those unblock. The epic must NOT be marked complete while the HOS-008-D2 and
  HOS-011-D4 human decisions it depends on are open.

escalate_to_human:
  - "FRAMING CHOICE (the one direct ask): approve Option B — NIST/FIPS as vocabulary + hygiene floor, declining FIPS 140-3 validation and full 800-53 compliance — vs Option A (status quo) vs Option C (full compliance program). The board's recommendation is B, GREEN_LIGHT."
  - "KEY CUSTODY / JURISDICTION (inherited from HOS-2026-008-D2, still owed): where the field-encryption decryption key lives and whether host legal-compulsion reaches it. Has a legal dimension, ideally counsel. Until answered, field encryption is a leak control only and is labeled as such; this epic cannot be marked complete while it is open."
  - "CASE/PII ORG-PARTITIONING (inherited from HOS-2026-011-D4, still owed): whether reunification case/PII data is a deliberately shared cross-org pool or must be org-partitioned. Gates the case-table half of any RLS work AND the Expansionist's shared-instance upside; this epic only tags RLS in the framework, it does not unblock it."
  - "OUTWARD FRAMEWORK (new, low-stakes): is the near-term target funder/partner US-based (NIST is the right passport) or EU/UN-based (ISO 27001 / ICRC is)? Informs how the outward artifact is shaped; not a build blocker."

overall: >
  GREEN_LIGHT on Option B: adopt NIST/FIPS as a shared vocabulary and a hygiene floor, decline
  the compliance theater (FIPS 140-3 validation, full 800-53 certification) as wrong for a small
  NGO under a host-compulsion threat model, and complete the already-blessed HOS-008 minimization/
  retention/oracle work under recognized labels. The decision is approved because it introduces no
  new political question (state-in-scope already answered YES) and no new external dependency for
  its core, and because it converts security work HOS already does into something funders and
  partner agencies can read — the passport the Expansionist rightly values. Four reshapes make it
  honest: (1) the complement-not-substitute statement is a binding, template-level gate on every
  outward artifact, because a named framework is a louder claim than ad-hoc security and the apex
  threat — host compulsion — is untouched by it (the controls that hold there are minimization,
  non-retention, and off-host key custody, not NIST's); (2) the Postgres TLS peer-authentication
  defect, the one genuinely-open hole in the packet, is promoted to the lead code action and shipped
  with a regression test; (3) 'coordinator AAL2' is split into MFA-now vs per-person-attribution
  (sequenced with HOS-001-08) so we never report an identity assurance the code has not reached; and
  (4) the outward posture is cross-mapped to ISO 27001 / the ICRC data-protection canon, which is
  what humanitarian partners actually speak. The framework name stays out of user-facing copy; what
  a frightened family is told stays true and plain. Field encryption with real key custody, org-scoped
  RLS, and Detect/monitoring are real and correct but genuinely blocked on the HOS-008-D2 and
  HOS-011-D4 human decisions and on external dependencies — they are tagged honestly as escalations/
  blocked, and this epic is not complete while those two human decisions remain open.
