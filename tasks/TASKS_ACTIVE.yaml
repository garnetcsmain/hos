      - { id: "HOS-2026-013-00", title: "Pulso prototype: standalone coordinator-gated live pulse board at /pulso (own sidebar entry)", owner: "DEV", status: "done", priority: "MEDIUM", note: "Human direction 2026-07-03, two rounds. R1 ('show me on the actual site, run it locally'; orientation corrected: help ships FROM sites, so supply is LEFT, district needs RIGHT) built it as a third console view. R2 ('debería estar fuera de coordinación en el sidebar; hazlo más entretenido/dinámico') moved it OUT of the console to its own route /pulso + 'Pulso' sidebar entry (console back to Lista | Mapa), same coordinator gate (shared helpers extracted to lib/client/coordinatorSession.ts), and made it presentation-grade: dark canvas, count-up metrics (converge on real values, never invented), rotating spotlight of latest real events, comet-trail SMIL pulses (red = critical), critical-district throb rings, click-to-focus a district, 45 s auto-refresh. Plus a LOUDLY LABELED demo mode (HOS-2026-013's labeled-demonstration concept): dashed amber sample flows + «demo»-tagged rows + diagonal DEMOSTRACIÓN watermark; real metrics never faked; real mode still says 'tablero quieto = respuesta quieta' (honesty principle). Verified: typecheck + 88/88 tests + visual check of both modes at localhost:3010/pulso. R3 (same day, 'el fondo es horrible' + Dala style reference): restyled to a pure-black void — no panels/borders/cards, hierarchy by SCALE not weight (38px count-up numbers, 27px spotlight, uppercase tracked labels), single violet accent (#8052FF) reserved for the one pill CTA + assigned pulses, amber for attention, outlined nodes, and a DECORATIVE ambient field of chromatic triangle particles (deterministic positions, slow drift — honesty copy updated to say background particles are texture, only pulses on lines are data). Legibility-first per human: content white/#BDBDBD, labels #9A9A9A, nothing under 11px. Re-verified both modes visually. R4 (same day): moved canvas back to WHITE ('el fondo es horrible', header/canvas clash). R5 (same day, 'que el usuario pueda ponerlo blanco o dark a su gusto y guardarlo en sus preferencias'): added a per-user LIGHT/DARK toggle (sun/moon) persisted in localStorage (hos.pulse.theme via lib/client/pulseTheme.ts; first visit falls back to prefers-color-scheme, then explicit choice sticks — no server prefs store yet, blocked on the same auth/RLS chain, so per-device is the honest MVP). Full dual palette (amber TEXT darkens in light for legibility; red/green keep operational meaning; violet constant). Header themed too via new AppShell/Header headerTheme prop so dark mode has no white strip. Verified: typecheck + 88/88 tests; light+dark rendered, toggle persists (stored 'light' after click), survives reload, OS-default fallback confirmed. PUBLIC variant deliberately NOT built — stays behind the 007 gate re-review + a tested PII-free aggregate feed." }
      - { id: "HOS-2026-013-01", title: "D5 console ergonomics: collapse per-card assign controls, add site/need search, triage presets (behind existing gate)", owner: "DEV", status: "todo", priority: "MEDIUM", note: "Board-cleared 2026-07-12 (judge D1). Independent of the public layer; unanimous PROCEED. Pairs with HOS-2026-007-09 pagination; this is the deeper density work HOS-2026-013-D5 reserved so the console redesign happens once." }
      - { id: "HOS-2026-013-02", title: "D3 onboarding to a useful screen: one-question entry, second tap = category -> district map, pictograms, INTAKE minimization", owner: "DEV", status: "todo", priority: "HIGH", note: "Board-cleared 2026-07-12 (judge D1). Second choice must be a CATEGORY landing on the district map filtered nearest-open-first (not a submenu); pictograms primary for sub-12yo literacy. Binding: the 'Necesito ayuda' flow collects the minimum by construction (structured category+district over free-text, in-flow 'no escriba nombres' nudge) — add success criterion 'onboarding does not increase free-text PII intake per need vs current console' (Contrarian Flaw 5)." }
      - { id: "HOS-2026-013-03", title: "D2 Mi tablero: local personalized/shareable view; critical safety banners a SEPARATE unfilterable channel by construction", owner: "DEV", status: "todo", priority: "MEDIUM", note: "Board-cleared 2026-07-12 (judge D1). No account, local, one-tap delete. Safety/evacuation banners rendered outside the personalizable region, ungated by any filter, never encoded into or suppressible by the shareable URL, cross-district by banner type (not author-optional). Foreground the shareable link/OG card as a first-class product; offer the composer only after first success (User)." }
      - { id: "HOS-2026-013-04", title: "D4 Ver-como interim (public-vs-coordinator): server-side re-fetch as an UNAUTHENTICATED client, tested invariant", owner: "DEV", status: "todo", priority: "MEDIUM", note: "Board-cleared 2026-07-12 (judge D4). MUST re-fetch through the true anonymous endpoint; client-side masking PROHIBITED (would leave sensitive data incl. 014 steward identity in the browser). 'Preview never has access to any field above the previewed audience' is a tested invariant. Recorded as a smoke test, NOT admissible as proof the feed is safe in the 007 gate." }
      - { id: "HOS-2026-013-05", title: "Design-once (gate-neutral): versioned PII-free aggregate feed CONTRACT — typed allowlist DTO + query-level k-suppression + adversarial tests", owner: "DEV", status: "done", priority: "MEDIUM", note: "SHIPPED 2026-07-17. lib/domain/aggregateFeed.ts is the pure, region-agnostic contract: PublicAggregateFeed/AggregateCell DTO (no field can hold a name/free-text/coordinate/id/timestamp), toPublicAggregateFeed() projection, AGGREGATE_FEED_SCHEMA_VERSION, defaultAggregateFeedParams(). TWO minimization layers per judge D3: (1) typed ALLOWLIST — the output district/category VALUES come from params.regions/params.categories (the projection iterates the declared vocabulary grid and COUNTS matches; a need's own district/category is only ever compared, never copied), so an injected name in a need field can never surface; (2) k-suppression at aggregation — a district×category cell below params.kThreshold (default 5) is never emitted. Cadence DROPPED not coarsened (judge D2): single retrospective snapshot, only status=open counted, bucket is a coarse day-grain label, no posted->assigned interval. region/category are declared PARAMETERS not VE hard-codes (VE vocab supplied via DISTRICT_OPTIONS+NEED_CATEGORIES, kept separate from the pure grid). schema_version + full params echoed in payload. ONE clean read endpoint api/coordination/aggregate — COORDINATOR-GATED (requireCoordinator), ships NOTHING publicly, does NOT pre-empt the 007 gate. 13 adversarial/fuzz tests (400 randomized inputs + PII-injection cases) pin allowlist + k-suppression + no-cadence + determinism; 140/140 web tests, lint clean, build:web exit 0 with the route registered. 'Future consumers' note: docs/decision-log/2026-07-03-HOS-013-public-presentation-ux/aggregate-feed-contract.md. This is the single public projection D1-public, D4, and 014's public 'confirmado' string all share; the aggregate TARGETING-oracle residual (Strava) is out of scope here and stays HOS-2026-013-06 (GATED, needs the pattern-inference simulation)." }
