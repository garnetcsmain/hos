    board_status: "BOARD REVIEWED 2026-07-12 (full 5-persona run + judge, reviewed jointly with HOS-2026-014). Verdict RESHAPE with a clean split. CLEARED TO BUILD NOW (tactical, no strategic gate, no new dependency): D5 console ergonomics, D3 onboarding (second tap = category -> district map, pictograms, INTAKE minimization so easy-to-DO does not become easy-to-inject-PII), D2 Mi tablero (critical/safety banners a SEPARATE unfilterable channel by construction, shareable link/OG card first-class, local-only), D1 coordinator-gated pulse board (already prototyped; snapshot-first acceptance criterion + opt-in animation), and D4 Ver-como interim public-vs-coordinator preview (MUST be a server-side re-fetch as a genuinely UNAUTHENTICATED client, never a client-side mask; a smoke test not proof). HELD behind the HOS-2026-007 public-feed gate: the D1 PUBLIC pulse board / public aggregate feed, INCLUDING any animated 'labeled demo' on the public landing (pre-empts the closed gate + label doesn't survive a WhatsApp/screenshot). Decisive finding (Researcher/Strava precedent + Contrarian): k>=5 + 15-min buckets stop INDIVIDUAL re-identification but NOT the aggregate-PATTERN targeting oracle ('which district is weakest right now, how fast does help arrive') via snapshot-differencing / suppression-as-signal / posted->assigned INTERVAL leakage — so the public flip needs an adversarial pattern-inference SIMULATION on real district data, not just serializer tests. Minimization must be TWO layers: typed allowlist DTO (field-level, by construction) + query-level k-suppression (statistical), not 'serializer tests' (Principals). Pre-gate public surface = a STATIC retrospective snapshot + honest static totals, not synthetic motion. Design-once/gate-neutral (Expansionist): shape the PII-free feed as a versioned parameterized CONTRACT now, build no widget/syndication. See judge_decision.yaml."
