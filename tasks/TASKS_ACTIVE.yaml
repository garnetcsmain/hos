    board_status: "Board run 2026-07-01 — KILL (D1, server-side face-biometric path), GREEN_LIGHT (D2, non-biometric device-key+PIN path), RESHAPE (D3, geolocation advisory signal). ADDENDUM R1 (2026-07-01, docs/decision-log/.../addendum-r1-judge-decision.yaml): principal proposed on-device-only face-uniqueness dedup at registration (no server storage) + role-vs-action scoping of geofencing for remote/text-based volunteers (e.g. translators). Focused re-review (Contrarian+Principals+Researcher): RESHAPE both — (R1-D1) on-device dedup approved as architecture but must not persist raw embeddings (75-95% reconstructable per real research — treat as a real face, not 'just numbers'), must be framed as accidental-duplicate hygiene not anti-Sybil (structurally can't catch cross-device duplicates — same conclusion World ID/Worldcoin reached), needs a cancelable/salted transform if anything is persisted, and needs shared-device cache lifecycle defined; (R1-D2) ACTION-scoping (does this submission carry a location claim?) strongly preferred over ROLE-scoping (is this account's role exempt?) — HOS has no role primitive today and the planned HOS-2026-001-08 taxonomy doesn't even include 'remote/translator', so role-scoping would expand unbuilt work to serve a soft signal and remains gameable via self-declared role; action-scoping is buildable now and closes the gaming vector by construction. Strongly supported by real precedent (Digital Humanitarian Network/Standby Task Force/MicroMappers, Translators Without Borders' 100k+ self-registering remote volunteers). Human + legal sign-off still required before any build."
    tasks: []  # no tasks until human sign-off; prototyping (cancelable-transform feasibility, real false-match/reject rates) should precede scheduling per R1-D1's next_gate. ADDENDUM R2 (2026-07-01, addendum-r2-judge-decision.yaml): defined "sensitive operations" scope. Governing rule (Principals, convergent across all 4 reviewers): step-up applies only to actions IRREVERSIBLE OR DESTRUCTIVE TO AN EXISTING RECORD, never to creating new content — applied to HOS's verified two-create-only-endpoint surface, the list is EMPTY today. KILL on content-conditional step-up for condition=deceased (unanimous 4/4 — redundant with existing familyReach.ts/isSensitiveOutcome D4 handling, creates a mis-marking incentive, is a duress footgun, no comparable system gates first-time content creation this way per OWASP/NIST/banking research); replace with a non-auth plain-language confirm dialog if any UX safety net wanted. Edit/retract: standing rule only (append-only/tombstone design primary, PIN step-up secondary) for IF such an endpoint is ever built — none exists, none authorized here. Shared-device identity switch: real requirement, but reclassified OUT of "sensitive ops" and INTO D2/HOS-2026-001-08's session design (incoming volunteer activates their own session with their own PIN at handoff — attribution, not step-up) — carry forward as a named requirement, don't drop it.

  - epic_id: "HOS-2026-011"
    title: "Platform role and authorization model (agency-admin, remote/digital contributor, org isolation)"
    decision_link: "docs/decision-log/2026-07-01-HOS-011-role-authorization-model/judge-decision.yaml"
    status: "in-progress"
    progress: "Phase 1 (identity/attribution/membership schema) shipped 2026-07-03"
    board_status: "Focused board run 2026-07-01 (Contrarian+Principals+Researcher) — RESHAPE on D1-D3 and D5, ESCALATE on D4. (D1) Authorization modeled as capabilities-on-scoped-resources (action, scope in {global,org:<id>,site:<id>,self}), not a flat role enum — coordinator/agency-admin/field-volunteer/remote-contributor are bundles of capabilities at a scope, not first-class primitives; validated against Primero (UNICEF). Rename the planned person-facing 'responder' role to avoid a verified collision with the existing OrgKind enum value 'responder' in coordination.ts. (D2) Remote/digital contributor is its own capability bundle, a structural peer of field-volunteer (not a flag on it) — org-optional registration preserved per HOS-2026-010-R1; no new geofencing mechanism needed, HOS-2026-010-R1-D2's action-scoping already covers it. (D3) Org isolation MUST be Postgres RLS, fail-closed, keyed on a server-set claim — critical finding: zero coordination write route today checks row ownership (requireCoordinator is the only gate on all 12 privileged routes), and if the org claim ever lands in Supabase user_metadata instead of raw_app_meta_data it fails open silently. Needs a real user<->org<->capability-bundle join table (many-to-many). Hard-blocked on HOS-2026-001-07 (Postgres). (D4 ESCALATE — human policy decision, not engineering): org_id exists on coordination tables (sites/needs/offers) but NOT on case/PII tables (missing_reports/found_reports/verifications) — 'agency-admin sees only their org's PII' is UNBUILDABLE on the most sensitive data today without deciding whether reunification case data is a deliberately shared cross-org pool or needs the same org-partitioning as coordination data (a real, currently-unscoped schema change either way). (D5) Mid-tier 'site-lead' role: real per a verified code-level ownership rule (a supply need's 'received' status may only be set by 'the requesting site' per coordination.ts) but not urgent — include site:<id> as a valid scope value now (near-free, same mechanism as org-scope), defer building/onboarding a named site-lead role until after agency-admin+RLS land."
    tasks:
      - { id: "HOS-2026-011-01", title: "Auth Phase 1: identity threading + forensic event attribution + org_memberships schema", owner: "DEV", status: "done", priority: "HIGH", note: "Human direction 2026-07-03 ('complete the auth/RLS gap'); scope honestly limited to what is real today — docs/design/2026-07-03-auth-rls-phase1.md. requireCoordinator now RETURNS CoordinatorIdentity (supabase email/userId, or honestly 'token'/'dev-open'); all coordination write routes thread actorTag() into services; every coordination event payload carries `by` (closes the gate re-review's MET_WITH_WATCH to the extent possible pre-real-auth). org_memberships (user_id, org_id, capability_bundle) provisioned in all 3 schema paths per D3 — deliberately UNUSED until real per-user auth populates it (no fake controls). RLS design chosen (SET LOCAL per-request context + non-owner pool role) and documented as NOT-YET-ENFORCED — shipping policies today would be decorative (single pool role owns the tables). Phase 2/3 sequenced behind HOS-2026-001-08; case/PII half still blocked on the D4 human answer (NOT covered by the 2026-07-03 D1 answer)." }
      - { id: "HOS-2026-011-02", title: "Self-signup + ownership-based site authorization (site:<id> scope made concrete)", owner: "DEV", status: "done", priority: "HIGH", note: "Human direction 2026-07-03 ('build sign ups no approval needed'; model: creator=responsable, peer-delegated site-coordinators vetted onsite, no central approval). docs/design/2026-07-03-self-signup-and-site-ownership.md. THREE TIERS: anonymous / contributor (self-signup, email-verified) / coordinator (invite-only, unchanged). SECURITY INVARIANT held: a contributor CANNOT read the needs board (precise locations + contacts stay coordinator-only, D1) — GET /api/coordination stays requireCoordinator; contributors read GET /api/coordination/mine (contributorView: public aid points + managedSiteIds, NO needs field — asserted by test, verified live hasNeeds:false). BUILT: signUp (supabase, email verify = bot floor not approval); two gates requireUser (any verified session, all CREATE endpoints) vs requireCoordinator (allowlist, sensitive board + need transitions); sites.created_by_user_id/email (creator=responsable); canManageSite = coordinator|owner|active-grant; site_grants(site_id,email,granted_by,expires_at) peer delegation keyed on EMAIL (what the responsable enters onsite, no admin lookup), revocable/time-boxed, owner-or-coordinator-only to grant; /api/me, /api/coordination/mine, /api/coordination/sites/access. UI: /signup + 'Crear cuenta' on login, CoordinationEntry branches coordinator->console vs contributor->ContributorView (Colaborar surface: create flow + Mis sitios w/ capacity/avisos/delegation), ?vista=colaborador preview. Need transitions + case/PII partitioning still coordinator/deferred. RLS still app-layer (Phase 3 pending). 110/110 tests incl. 5 authz-boundary tests; lint+tsc clean; verified live." }

  - epic_id: "HOS-2026-012"
    title: "Volunteer skill/needs model, donor actor type, and AI task/supply matching (\"three ranked options, human decides\")"
    decision_link: "docs/decision-log/2026-07-01-HOS-012-volunteer-donor-task-matching/judge-decision.yaml"
    status: "planning"
    progress: "0%"
    board_status: "Full 5-persona board run 2026-07-01 (Contrarian+Expansionist+Principals+Researcher+User) — RESHAPE on all 5 sub-decisions. (D1) Switchable volunteer skill: Researcher found NO real precedent for daily-switchable skill (Team Rubicon/ESAR-VHP/FEMA VRC all use persistent, verified skill records) — reshaped to current-state-only (mirrors Offer.status), corrected in-the-moment at match time, not a self-maintained profile page; flagged as a genuinely untested HOS-specific design needing pilot validation. (D2) Volunteer personal-needs (e.g. \"car but no gas\"): model as a Need-type record with subjectType:person, auto-expiring, displayed like an org need (not a pinned personal limitation). (D3) Donor actor type: not a naming collision but a structural one — every table has a hard NOT NULL FK to orgs, no non-org actor concept exists. Resolve via a subjectType:org|person discriminator (Stripe-style) or two-linked-types (Salesforce NPSP-style) — same mechanism as D1/D2, decided deliberately before implementation. Donor onboarding must cost about as much effort as texting a sentence (no org-shaped form). (D4) Location-weighted matching — the most consequential finding: near-unanimous rejection of precise/persistent per-volunteer location tracking (\"movement diary by construction\" per Contrarian; de Montjoye et al. show coarsening is only a weak, slow-acting defense; Operación Tun Tun now has a named fatal case in exactly this population). Reshaped to district-level scoring only (same grain as HOS-2026-007/010), no durable per-volunteer match history (short-TTL counters only), and audit reasons attached to the Need record (not a per-volunteer log). (D5) \"Exactly three\" options: mechanism (scored, reasoned, non-padded, human-decides) approved; the specific number is unvalidated per Researcher (choice-overload meta-analysis shows ~zero effect, Miller's 7±2 explicitly disclaimed by its own author, START — the actual dominant mass-casualty protocol — uses 4 categorical buckets not a ranked list) — reshaped to a floor-gated cap, validated empirically once built, not a hardcoded 3."
    tasks: []  # no tasks until human sign-off; sequenced behind HOS-2026-010 (device-key+PIN identity substrate) and HOS-2026-011 (capability-scoped authorization) actually landing, same as those decisions' own conditions require

