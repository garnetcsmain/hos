  - epic_id: "HOS-2026-014"
    title: "Site stewardship: claiming a site, requirements, remote verification, freshness accountability"
    decision_link: "docs/decision-log/2026-07-03-HOS-014-site-stewardship/judge_decision.yaml"
    status: "board-reviewed — RESHAPE (honest interim slice cleared to build; ownership-reassurance + remote claim held)"
    progress: "5% (board gate cleared 2026-07-12; honest interim slice cleared, remote/enforced halves gated)"
    board_status: "BOARD REVIEWED 2026-07-12 (full 5-persona run + judge, reviewed jointly with HOS-2026-013). Verdict RESHAPE (5/5 reviewers). Clean split: ship STALENESS HONESTY now, withhold OWNERSHIP REASSURANCE until a verified identity exists. CLEARED TO BUILD NOW (coordinator gate, no new dependency): the 'sitios vencidos' triage list + honest decaying freshness badge + attributed liveness ACTIONS in the audit + a coordinator-vouched steward record SHAPED as the future site:<id> grant (scope-parametric) with a TRUST-TIER FLAG ('honor'|'verified') on every write (append-only makes this prevent-now-or-never) + split one-tap 'confirmar operativo' from the bed-count chore. WITHHELD/reshaped: (a) rendering a NAMED 'responsable'/'confirmado por el responsable' as verified accountability (interim renders 'confirmado, identidad no verificada' / site-shift grain, caveat at equal weight — Contrarian Flaw 2, Principals); (b) AUTOMATIC lapse -> a COORDINATOR ACTION off the triage list (auto-lapse infers neglect from silence and could label a DETAINED steward negligent — Tun Tun; also publishes a ripe-target list + farmable poison-window + biases control to the online remote actor); (c) the SELF-REQUEST claim queue -> DEFERRED from the interim (cheapest fake-steward attack path; coordinator-initiated grants already keep remote first-class); (d) the REMOTE self-confirm loop -> HELD until a remote confirm asserts a FRESH source, is rendered provenance-distinct, and offers a no-penalty 'no pude confirmar'. Verification must bind a CLAIMANT-controlled factor (a call to the site's PUBLIC number verifies the phone, not the claimant — Contrarian Flaw 1; 'org vouches' is the elite-capture vector — Researcher/Somalia); separation-of-duties on high-harm 'cerrado'/'operativo' writes. SLAs (24h/24h/48h are 3-20x faster than real CCCM cadence — Researcher) reframed as trust-decay, loose/instrumented, tuned in pilot. Steward safety extended beyond the NAME: coarsen public confirmation timing to a staleness BAND (a daily 'hace 2h' publishes a single keeper's routine), coordinator-only audit, role-grain aviso authorship, 013 'Ver como' tested to strip steward identity. Enforced version blocked on the unchanged 010/011/Postgres chain. See judge_decision.yaml."
    tasks:  # honest interim slice cleared 2026-07-12; remote/self-request/enforced halves gated (see judge_decision.yaml)
      - { id: "HOS-2026-014-01", title: "Honest interim slice: 'sitios vencidos' triage + decaying badge + attributed actions + grant-shaped scope-parametric steward record + trust-tier flag + split confirm/bed-count + coordinator-driven lapse", owner: "DEV", status: "todo", priority: "HIGH", note: "Board-cleared 2026-07-12 (judge D1/D2/D3). Reuses audited updateSiteCapacity + freshness badges + provisioned site_grants schema. NON-NEGOTIABLE: trust-tier flag on every write (append-only = impossible to reconstruct later); record modeled as the site:<id> grant with scope-as-a-VALUE (district/category later = a scope value, not a migration); confirmation rendered as honor-system NOT verified identity (caveat at equal weight; shared device = site/shift grain); one-tap 'confirmar operativo' split from the bed-count field (each own freshness); lapse degrades the badge then a COORDINATOR releases the grant (no silent timer); SLAs loose/instrumented, tuned after 2-4 weeks. Minimize the record (handle not legal name; justify storing the contact channel at all). Name the re-verification backlog as a cost of the interim." }
      - { id: "HOS-2026-014-02", title: "Steward safety hardening: staleness-band public timing (shared with 013), coordinator-only audit, role-grain aviso authorship, Ver-como strips steward identity", owner: "DEV", status: "todo", priority: "HIGH", note: "Board-cleared 2026-07-12 (judge D5). The targetable asset is the routine, not just the name: public surfaces show a staleness BAND ('confirmado en las ultimas 24h'), drop the 'por el responsable' clause. Per-site audit/history is coordinator-only (contributor tier must NOT read it); aviso authorship role-grain (never a steward handle); any 013 'Ver como' path tested to strip steward identity. Treat any leak of steward name OR presence cadence as a SECURITY bug. Solve the timing-coarsening once, shared with HOS-2026-013-05." }
      - { id: "HOS-2026-014-03", title: "Remote claim + self-request queue + enforced stewardship — GATED (do not build in interim)", owner: "CTO", status: "blocked", priority: "MEDIUM", note: "HELD (judge D4): self-request queue deferred from the interim; remote self-confirm loop held until fresh-source assertion + provenance-distinct rendering + no-penalty 'no pude confirmar'; verification must bind a claimant-controlled factor (callout one-time code returned by claimant, or a VERIFIED steward co-sign) + separation-of-duties on high-harm writes. Enforced (capability-checked writes, RLS, verified identity) rides the 010/011/Postgres chain + human/legal — same sign-offs those decisions already escalated; no NEW human question for the interim. Flag for Contrarian+legal only IF ever proposed: a cross-org steward reputation graph may cut against HOS-2026-008 non-retention." }

